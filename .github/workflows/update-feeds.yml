name: Update feeds

# Regenerates the machine-consumed feeds under api/ on every published release,
# replacing the old hand-edited "point feeds at vX.Y.Z" pull request per release:
#   - api/update.json + api/update-V2.json: version and HoryTweaks.dll download
#     link read from the published release (consumed by
#     src/HoryTweaks/Remote/Updates/BAUUpdateLoader.cs in the mod).
#   - api/manifest.json: News index rebuilt from the files under api/news/
#     (consumed by src/HoryTweaks/Remote/News/NewsLoader.cs).
# The result is committed straight back to main as github-actions[bot] because
# the feeds only take effect from the default branch. The run fails before
# regenerating when api/news/ has no entry for the tagged version, so a release
# cannot silently ship without a news post. To repair feeds for an existing tag
# run the workflow manually: Actions > Update feeds > Run workflow (tag input,
# defaults to the latest release).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rebuild feeds for (for example v0.1.3); defaults to the latest published release
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  update-feeds:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve release tag and assets
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$(gh release view --json tagName --jq .tagName)}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Tag must look like v0.1.3: $tag" >&2
            exit 1
          fi
          base_url="https://github.com/${{ github.repository }}/releases/download/${tag}"
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          asset_url() {
            local name="$1" url
            url="$(gh release view "$tag" --json assets --jq ".assets[] | select(.name == \"$name\") | .browser_download_url")"
            if [[ -z "$url" ]]; then
              echo "::warning::Release $tag has no $name asset; using the canonical download URL" >&2
              url="$base_url/$name"
            fi
            echo "$url"
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "dll_url=$(asset_url HoryTweaks.dll)" >> "$GITHUB_OUTPUT"
          echo "steam_epic_msstore_package_url=$(asset_url "HoryTweaks-Steam-Epic-MsStore-${tag}.zip")" >> "$GITHUB_OUTPUT"
          echo "itchio_package_url=$(asset_url "HoryTweaks-Itchio-${tag}.zip")" >> "$GITHUB_OUTPUT"
          echo "sha256sums_url=$(asset_url SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"
          echo "$assets" | grep -qx 'SHA256SUMS.txt' || echo "::warning::Release $tag has no SHA256SUMS.txt; the in-game updater will fall back to the DLL swap until a release ships one" >&2

      - name: Check a news entry exists for the tag
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          if ! compgen -G "api/news/*${tag}.yaml" > /dev/null \
            && ! compgen -G "api/news/*${tag}-H*.yaml" > /dev/null; then
            echo "::error::api/news/ has no yaml entry for ${tag}; add one and re-run the Update feeds workflow" >&2
            exit 1
          fi

      - name: Regenerate feeds
        run: |
          pwsh -NoProfile -File src/HoryTweaks/build/UpdateFeeds.ps1 \
            -Tag "${{ steps.release.outputs.tag }}" \
            -DllUrl "${{ steps.release.outputs.dll_url }}" \
            -SteamEpicMsStorePackageUrl "${{ steps.release.outputs.steam_epic_msstore_package_url }}" \
            -ItchioPackageUrl "${{ steps.release.outputs.itchio_package_url }}" \
            -Sha256SumsUrl "${{ steps.release.outputs.sha256sums_url }}"

      - name: Commit feeds to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/update.json api/update-V2.json api/manifest.json
          if git diff --cached --quiet; then
            echo "Feeds already up to date for ${{ steps.release.outputs.tag }}; nothing to commit."
            exit 0
          fi
          git commit -m "chore(feeds): update update feeds for ${{ steps.release.outputs.tag }}"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
