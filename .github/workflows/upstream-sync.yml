name: Upstream sync

# Weekly drift check against the upstream fork parent (D1GQ/BetterAmongUs):
#   - Nothing new upstream -> exits silently.
#   - New commits that merge cleanly -> pushes upstream-sync-<date>-<sha> and
#     opens a pull request against main.
#   - Merge conflicts -> aborts and opens (or comments on an existing) GitHub
#     issue titled "Upstream sync needs manual merge" listing the conflicting
#     files and the manual steps. Never pushes a half-resolved merge.
# To run it now: Actions > Upstream sync > Run workflow.
# See docs/UPSTREAM-SYNC.md for the manual-merge how-to and fork gotchas.

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_URL: https://github.com/D1GQ/BetterAmongUs.git
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and detect drift
        id: detect
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream --quiet
          git remote set-head upstream --auto
          UPSTREAM_REF="$(git symbolic-ref --short refs/remotes/upstream/HEAD)"
          BEHIND="$(git rev-list --count HEAD.."$UPSTREAM_REF")"
          AHEAD="$(git rev-list --count "$UPSTREAM_REF"..HEAD)"
          echo "upstream_ref=$UPSTREAM_REF" >> "$GITHUB_OUTPUT"
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$(git rev-parse --short "$UPSTREAM_REF")" >> "$GITHUB_OUTPUT"
          echo "Upstream ($UPSTREAM_REF) is $BEHIND commit(s) ahead; main is $AHEAD commit(s) ahead of upstream."
          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date; nothing to do."
          fi

      - name: Attempt merge of upstream
        id: merge
        if: steps.detect.outputs.behind != '0'
        env:
          UPSTREAM_REF: ${{ steps.detect.outputs.upstream_ref }}
          UPSTREAM_SHA: ${{ steps.detect.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          BRANCH="upstream-sync-$(date +%Y%m%d)-$UPSTREAM_SHA"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git log --oneline HEAD.."$UPSTREAM_REF" > "$RUNNER_TEMP/upstream_commits.txt"
          git checkout -b "$BRANCH"
          if git merge "$UPSTREAM_REF" --no-edit; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicting_files.txt"
            git merge --abort
            echo "clean=false" >> "$GITHUB_OUTPUT"
            echo "Merge conflicts; see the tracking issue for details"
          fi

      - name: Push branch and open pull request
        if: steps.merge.outputs.clean == 'true'
        env:
          BRANCH: ${{ steps.merge.outputs.branch }}
          UPSTREAM_REF: ${{ steps.detect.outputs.upstream_ref }}
        run: |
          set -euo pipefail
          git push -u origin "$BRANCH"
          {
            echo "Automated sync of [\`$UPSTREAM_REF\`](https://github.com/D1GQ/BetterAmongUs) into \`main\`. The merge completed cleanly."
            echo
            echo "### Upstream commits in this merge"
            echo '```'
            cat "$RUNNER_TEMP/upstream_commits.txt"
            echo '```'
            echo
            echo 'See `docs/UPSTREAM-SYNC.md` for how this workflow operates.'
          } > "$RUNNER_TEMP/pr_body.md"
          gh pr create \
            --title "Upstream sync: $(git log -1 --format=%s "$UPSTREAM_REF")" \
            --body-file "$RUNNER_TEMP/pr_body.md" \
            --base main \
            --head "$BRANCH" \
          || gh pr view "$BRANCH"  # branch/PR may already exist on a same-day re-run

      - name: Open or update tracking issue on conflicts
        if: steps.merge.outputs.clean == 'false'
        env:
          UPSTREAM_REF: ${{ steps.detect.outputs.upstream_ref }}
          BEHIND: ${{ steps.detect.outputs.behind }}
        run: |
          set -euo pipefail
          TITLE="Upstream sync needs manual merge ($BEHIND commits behind)"
          {
            echo "The automated upstream sync could not merge \`$UPSTREAM_REF\` into \`main\` cleanly."
            echo
            echo "### Upstream commits waiting ($BEHIND)"
            echo '```'
            cat "$RUNNER_TEMP/upstream_commits.txt"
            echo '```'
            echo
            echo "### Conflicting files"
            echo '```'
            cat "$RUNNER_TEMP/conflicting_files.txt"
            echo '```'
            echo
            echo "### Manual steps"
            echo '```bash'
            echo "git remote add upstream $UPSTREAM_URL   # once"
            echo "git fetch upstream"
            echo "git checkout -b upstream-merge-manual origin/main"
            echo "git merge $UPSTREAM_REF                  # resolve the files listed above"
            echo "git add -A && git merge --continue"
            echo "git push -u origin upstream-merge-manual # then open a PR"
            echo '```'
            echo
            echo 'See `docs/UPSTREAM-SYNC.md` for fork-specific gotchas.'
          } > "$RUNNER_TEMP/issue_body.md"
          EXISTING="$(gh issue list --state open --limit 1 \
            --search 'in:title "Upstream sync needs manual merge"' \
            --json number --jq '.[0].number' || true)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$RUNNER_TEMP/issue_body.md"
            echo "Commented on existing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue_body.md"
            echo "Opened new tracking issue"
          fi
