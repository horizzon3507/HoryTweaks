 # HoryTweaks v0.1.4

 We are thrilled to announce this update of **HoryTweaks**, a BetterAmongUs fork designed to enhance your Among Us experience!
 ---

 ## Change Log

 #### New Features
 - **Hory-User Badge**: HoryTweaks players now show a distinct "Hory-User" tag next to their name in the lobby and in chat, while upstream BetterAmongUs players show as "Better-User"
 - **Host Transfer**: New /transferhost command and AFK host transfer
 ---
 #### Changed
 - **Verified Updates**: The updater now installs store-specific release packages verified against SHA256SUMS
 - **Badge Detection**: The Hory-User tag is detected inside the mod handshake itself, so it can't be claimed without running HoryTweaks
 ---
 ## Important

 - Badge detection only works for players running **v0.1.4+**: players on older versions — like BetterAmongUs users — always show as Better-User.
 ---
 ## [Github](https://github.com/horizzon3507/HoryTweaks/)

^content-pt_BR:
 # HoryTweaks v0.1.4

 Estamos felizes em anunciar esta atualização do **HoryTweaks**, um fork do BetterAmongUs feito para melhorar sua experiência no Among Us!
 ---

 ## Change Log

 #### Novidades
 - **Selo Hory-User**: jogadores com HoryTweaks agora mostram uma tag "Hory-User" ao lado do nome no lobby e no chat, enquanto jogadores do BetterAmongUs original aparecem como "Better-User"
 - **Transferência de Host**: novo comando /transferhost e transferência de host por AFK
 ---
 #### Mudanças
 - **Atualizações Verificadas**: o atualizador agora instala pacotes específicos da loja verificados contra SHA256SUMS
 - **Detecção do Selo**: a tag Hory-User é detectada dentro do próprio handshake do mod, então ela não pode ser reivindicada sem rodar HoryTweaks
 ---
 ## Importante

 - A detecção do selo só funciona para jogadores com **v0.1.4+**: jogadores em versões antigas — assim como usuários do BetterAmongUs — sempre aparecem como Better-User.
 ---
 ## [Github](https://github.com/horizzon3507/HoryTweaks/)
