 # HoryTweaks v0.2.0 (beta)

 Welcome to **HoryTweaks v0.2.0-beta** — a major stability, networking, and performance refactor built to stop unnecessary disconnects, tame ping spikes and lag, and bring cross-platform match replays to Among Us!
 ---

 ## Highlights

 #### Network Resilience & Anti-Disconnect
 - **Fast-Path Packet Dispatch**: Already-spawned GameData and RPC packets now dispatch synchronously on a zero-coroutine fast path, deferring asynchronously only for spawns or packets that arrive before their target spawns.
 - **Hazel UDP & Suspend Tuning**: New **Network Optimization** toggle (Page 3, enabled by default) raises client-side disconnect timeouts, finite resend limits, resend pacing, and Alt+Tab suspend tolerance while preserving original baselines and 100% compatibility with official Innersloth servers.
 - **Transient Send-Error Protection**: Isolated unreliable send errors no longer kick you out of a lobby immediately.
 - **Live Ping & Packet-Loss Warnings**: High ping, unstable jitter, and packet resend spikes surface localized warnings on the HUD plus detailed diagnostics in logs and `/dump`.
 ---
 #### Performance, Smart FPS & Warnings
 - **Smart Unlock FPS (120–240 FPS)**: Replaces the runaway 999 FPS cap with a display-aware 120–240 FPS target and warns about VSync conflicts, safety clamping, frame hitches, and sustained low FPS.
 - **Total Update-Loop Refactor**: Eliminated per-frame `Camera.main` lookups, main-menu hierarchy scans, `MessageReader` pool leaks, Wine/Proton ECDH exception storms, and redundant UI/TMP rebuilds.
 ---
 #### Replays & Quality of Life
 - **Match History 2D + POV `.mp4` Replay**: Review your last 25 matches on the real map or open lightweight real-POV `.mp4` videos on Windows and Linux/Steam Proton (Cisco OpenH264 + built-in MP4 muxer).
 - **QoL Tools**: Instant `/forceskip`, local `/mute` & `/unmute`, Discord-ready `/summary`, Alt+Tab window alerts, and non-blocking async console logging.
 ---
