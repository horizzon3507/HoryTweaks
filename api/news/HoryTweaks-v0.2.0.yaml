^content-pt_BR:
 # HoryTweaks v0.2.0 (beta)

 Bem-vindo ao **HoryTweaks v0.2.0-beta** — uma grande refatoração de estabilidade, rede e desempenho para reduzir desconexões fáceis, controlar picos de ping e lag e trazer replays de partida multiplataforma para o Among Us!
 ---

 ## Destaques

 #### Estabilidade de Rede e Anti-Desconexão
 - **Despacho Rápido de Pacotes**: Pacotes GameData e RPC para objetos já spawnados agora rodam de forma síncrona sem coroutines, adiando de forma assíncrona apenas spawns ou pacotes que chegam antes do objeto existir.
 - **Ajuste Hazel UDP e Alt+Tab**: A nova opção **Otimização de Rede** (Página 3, ligada por padrão) aumenta tolerância de desconexão, limite finito de reenvios, espaçamento de reenvio e tempo em segundo plano preservando os valores originais e 100% de compatibilidade com os servidores oficiais da Innersloth.
 - **Proteção contra Erros Transitórios**: Falhas isoladas de envio em pacotes não confiáveis não derrubam mais sua partida imediatamente.
 - **Avisos de Ping e Perda de Pacotes**: Ping alto, instabilidade (jitter) e picos de reenvio exibem avisos traduzidos no HUD e diagnósticos detalhados nos logs e no `/dump`.
 ---
 #### Desempenho, FPS Inteligente e Avisos
 - **Destravar FPS Inteligente (120–240 FPS)**: Substitui o teto descontrolado de 999 FPS por um alvo inteligente de 120–240 FPS baseado no monitor, com avisos de conflito de VSync, travamentos de frame e FPS baixo.
 - **Refatoração Total de Loops**: Eliminamos buscas `Camera.main` por frame, varreduras no menu principal, vazamentos de `MessageReader`, tempestades de exceção ECDH no Wine/Proton e reconstruções redundantes de UI/texto.
 ---
 #### Replays e Qualidade de Vida
 - **Histórico 2D + Replay POV em `.mp4`**: Revise suas últimas 25 partidas no mapa real ou abra vídeos `.mp4` leves no Windows e Linux/Steam Proton (Cisco OpenH264 + muxer MP4 nativo).
 - **Ferramentas de QoL**: `/forceskip` instantâneo, `/mute` e `/unmute` locais, resumo `/summary` pronto para Discord, alertas de janela em Alt+Tab e console assíncrono que não trava o jogo.
 ---
